<?xml version="1.0"?>
<!-- The LK mark embedded as the SAME raster the PNG favicons use: the old
     inline <text> asked for Space Grotesk, which no favicon context ever
     loads (SVG favicons render without webfonts), so Chrome/Firefox tabs
     showed the mark in a system fallback font while every other surface
     (PNG icons, manifest, apple-touch) showed the true brand glyphs. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <image width="256" height="256" href="data:image/png;base64,"/>
</svg>
