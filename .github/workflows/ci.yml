name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A push to a branch with an open PR fires both triggers; cancel the
# superseded run instead of building the same commit twice.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Active LTS. Keep in step with the Cloudflare Pages NODE_VERSION
          # env var (README, "Cloudflare Pages settings").
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npm test
