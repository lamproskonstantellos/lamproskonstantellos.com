name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# The job only reads the repo (checkout, build, test) - keep the GITHUB_TOKEN
# at least privilege rather than inheriting the repository default.
permissions:
  contents: read

# A push to a branch with an open PR fires both triggers; cancel the
# superseded run instead of building the same commit twice. Both refs are
# normalized to the BARE branch name so the two events share one group:
# github.head_ref is the PR's head branch (empty on push), github.ref_name is
# the bare branch on push. (github.ref alone is refs/heads/<branch> vs
# refs/pull/<n>/merge, and pull_request.head.ref vs github.ref mixes bare and
# refs/-prefixed forms — both earlier keys split the pair into two groups.)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Active LTS. Keep in step with the Cloudflare Pages NODE_VERSION
          # env var (README, "Cloudflare Pages settings").
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npm test
